[package]
name = "pasta"
version = "0.1.0"
description = "Screenshots annotieren und Textbausteine einfügen"
authors = ["Carsten Niehaus"]
license = "GPL-3.0-or-later"
repository = "https://github.com/cniehaus/pasty"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pasta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
xcap = "0.9.10"
image = { version = "0.25.10", default-features = false, features = ["png"] }
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
tauri-plugin-dialog = "2.8.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSGraphics"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }

# Optimise dependencies (image encoding, capture) even in debug builds;
# unoptimised PNG encoding of a Retina screenshot takes seconds.
[profile.dev.package."*"]
opt-level = 2
