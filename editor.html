<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pasta</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/editor/editor.css" />
    <script type="module" src="/src/editor/main.ts"></script>
  </head>
  <body>
    <header class="toolbar" id="toolbar">
      <div class="group" role="radiogroup" aria-label="Werkzeug">
        <button class="tool" data-tool="select" title="Auswählen (V)" aria-label="Auswählen">
          <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" /></svg>
        </button>
        <button class="tool" data-tool="marker" title="Nummer (N)" aria-label="Nummer">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" />
            <path d="M10.5 9l2-1.5V16" />
          </svg>
        </button>
        <button class="tool" data-tool="text" title="Text (T)" aria-label="Text">
          <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6" /></svg>
        </button>
        <button class="tool" data-tool="arrow" title="Pfeil (A)" aria-label="Pfeil">
          <svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9" /></svg>
        </button>
        <button class="tool" data-tool="frame" title="Rahmen (R)" aria-label="Rahmen">
          <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" /></svg>
        </button>
        <button class="tool" data-tool="magnifier" title="Lupe (L)" aria-label="Lupe">
          <svg viewBox="0 0 24 24">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="M15.5 15.5L20 20M8 10.5h5M10.5 8v5" />
          </svg>
        </button>
      </div>

      <div class="separator"></div>

      <div class="group" id="colors" role="radiogroup" aria-label="Farbe" data-for="none marker text arrow frame"></div>

      <div class="group segmented" role="radiogroup" aria-label="Größe">
        <button data-size="s" title="Klein">S</button>
        <button data-size="m" title="Mittel">M</button>
        <button data-size="l" title="Groß">L</button>
      </div>

      <label class="toggle" data-for="text" title="Text mit weißem Kasten hinterlegen">
        <input type="checkbox" id="boxed" />
        Kasten
      </label>

      <div class="group segmented" role="radiogroup" aria-label="Pfeilspitzen" data-for="arrow">
        <button data-heads="end" title="Spitze am Ende" aria-label="Spitze am Ende">
          <svg viewBox="0 0 24 24"><path d="M4 12h15M15 8l4 4-4 4" /></svg>
        </button>
        <button data-heads="start" title="Spitze am Anfang" aria-label="Spitze am Anfang">
          <svg viewBox="0 0 24 24"><path d="M5 12h15M9 8l-4 4 4 4" /></svg>
        </button>
        <button data-heads="both" title="Spitzen an beiden Enden" aria-label="Spitzen an beiden Enden">
          <svg viewBox="0 0 24 24"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4" /></svg>
        </button>
        <button data-heads="none" title="Keine Spitze (Linie)" aria-label="Keine Spitze">
          <svg viewBox="0 0 24 24"><path d="M4 12h16" /></svg>
        </button>
      </div>

      <div class="group segmented" role="radiogroup" aria-label="Form der Spitze" data-for="arrow">
        <button data-head-style="filled" title="Gefülltes Dreieck" aria-label="Gefülltes Dreieck">
          <svg viewBox="0 0 24 24"><path d="M4 12h9" /><path class="fill" d="M13 7l7 5-7 5z" /></svg>
        </button>
        <button data-head-style="open" title="Offene Spitze" aria-label="Offene Spitze">
          <svg viewBox="0 0 24 24"><path d="M4 12h15M14 7l5 5-5 5" /></svg>
        </button>
        <button data-head-style="dot" title="Punkt" aria-label="Punkt">
          <svg viewBox="0 0 24 24"><path d="M4 12h11" /><circle class="fill" cx="17" cy="12" r="3.5" /></svg>
        </button>
      </div>

      <div class="group segmented" role="radiogroup" aria-label="Form" data-for="frame">
        <button data-shape="rect" title="Rechteck" aria-label="Rechteck">
          <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" /></svg>
        </button>
        <button data-shape="ellipse" title="Ellipse" aria-label="Ellipse">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6" /></svg>
        </button>
      </div>

      <div class="group segmented" role="radiogroup" aria-label="Vergrößerung" data-for="magnifier">
        <button data-zoom="1.5" title="1,5-fach">1,5×</button>
        <button data-zoom="2" title="2-fach">2×</button>
        <button data-zoom="3" title="3-fach">3×</button>
      </div>

      <label class="toggle" data-for="magnifier" title="Alles außerhalb der Lupe unscharf darstellen">
        <input type="checkbox" id="blur-outside" />
        Rest unscharf
      </label>

      <div class="spacer"></div>

      <div class="group">
        <button id="undo" title="Rückgängig (⌘Z)" aria-label="Rückgängig">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3" /></svg>
        </button>
        <button id="redo" title="Wiederholen (⇧⌘Z)" aria-label="Wiederholen">
          <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3" /></svg>
        </button>
      </div>

      <div class="separator"></div>

      <div class="group">
        <button id="save-as" class="text-button" title="Speichern unter … (⇧⌘S)">Speichern unter …</button>
        <button id="save" class="text-button" title="In Bilder/Pasta speichern (⌘S)">Speichern</button>
        <button id="copy" class="text-button primary" title="In die Zwischenablage kopieren (⌘C)">
          Kopieren
        </button>
      </div>
    </header>

    <main class="stage" id="stage-area">
      <div id="stage"></div>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
